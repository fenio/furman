name: S3 Integration Tests (MinIO)

on:
  push:
    branches: [main]
    paths: ['src-tauri/**']
  pull_request:
    branches: [main]
    paths: ['src-tauri/**']

jobs:
  s3-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data

          docker run -d --name minio-other \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data

          # Wait for MinIO to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done

          for i in $(seq 1 30); do
            if curl -sf http://localhost:9001/minio/health/live; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live
          curl -sf http://localhost:9001/minio/health/live

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Run S3 integration tests
        working-directory: src-tauri
        env:
          MINIO_ENDPOINT: http://localhost:9000
          S3_TEST_OTHER_ENDPOINT: http://localhost:9001
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          FURMAN_JOB_TEST_ENDPOINT: http://127.0.0.1:9000
          FURMAN_JOB_TEST_ACCESS_KEY: minioadmin
          FURMAN_JOB_TEST_SECRET_KEY: minioadmin
        run: |
          cargo test --lib --test s3_integration --test s3_migration -- --test-threads=4
          cargo test --lib job_runs::tests::loopback_minio_native_binding_and_comparison_never_modify_payloads -- --ignored
          cargo test --lib job_runs::execute::tests::loopback_minio_local_create_execution_and_conflict_never_overwrite_existing -- --ignored
          cargo test --lib job_runs::execute::s3_tests::loopback_minio_s3_create_preserves_versioned_metadata_headers_and_tags_without_changing_source -- --ignored

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio minio-other || true
