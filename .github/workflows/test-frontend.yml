name: Frontend Type Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/test-frontend.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

      - name: Run eslint
        run: npm run lint
