name: SFTP Integration Tests

on:
  push:
    branches: [main]
    paths: ['src-tauri/**']
  pull_request:
    branches: [main]
    paths: ['src-tauri/**']

jobs:
  sftp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start SFTP server
        run: |
          docker run -d --name sftp-test \
            -p 2222:22 \
            atmoz/sftp testuser:testpass:::upload

          # Wait for sshd to be ready
          for i in $(seq 1 30); do
            if docker exec sftp-test pgrep sshd > /dev/null 2>&1; then
              echo "SFTP server is ready"
              break
            fi
            echo "Waiting for SFTP server... ($i/30)"
            sleep 1
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Run SFTP integration tests
        working-directory: src-tauri
        env:
          SFTP_TEST_HOST: localhost
          SFTP_TEST_PORT: 2222
          SFTP_TEST_USER: testuser
          SFTP_TEST_PASS: testpass
        run: cargo test --test sftp_integration -- --test-threads=4

      - name: Stop SFTP server
        if: always()
        run: docker rm -f sftp-test || true
