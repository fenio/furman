name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # To enable code signing, uncomment the following and add these secrets
      # to your repository settings:
      #   APPLE_CERTIFICATE        - Base64-encoded .p12 certificate
      #   APPLE_CERTIFICATE_PASSWORD - Password for the .p12 file
      #   APPLE_SIGNING_IDENTITY   - e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID                 - Apple ID email for notarization
      #   APPLE_PASSWORD           - App-specific password for notarization
      #   APPLE_TEAM_ID            - Your Apple Developer Team ID

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Furman ${{ github.ref_name }}"
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # Strip bundled WebKit and GStreamer from AppImage — they conflict
      # with system libraries on newer distros (e.g. Debian 13).
      # These must come from the host system.
      - name: Fix AppImage (strip bundled WebKit and GStreamer)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(ls src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/Furman_*.AppImage)
          echo "Fixing $APPIMAGE"

          # Extract
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          # Remove bundled WebKit
          rm -f squashfs-root/usr/lib/libwebkit2gtk-4.1*
          rm -f squashfs-root/usr/lib/libjavascriptcoregtk-4.1*
          rm -rf squashfs-root/usr/lib/webkit2gtk-4.1/

          # Remove bundled GStreamer (system WebKit needs matching system GStreamer)
          rm -f squashfs-root/usr/lib/libgst*
          rm -rf squashfs-root/usr/lib/gstreamer-1.0/

          # Repackage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool-x86_64.AppImage

          # Update the release asset
          VERSION=${GITHUB_REF_NAME#v}
          ASSET_NAME="Furman_${VERSION}_amd64.AppImage"
          gh release delete-asset "$GITHUB_REF_NAME" "$ASSET_NAME" --repo fenio/furman --yes || true
          gh release upload "$GITHUB_REF_NAME" "$APPIMAGE" --repo fenio/furman

      # Upload bare binary for Homebrew (no AppImage/FUSE overhead)
      - name: Upload Linux binary
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BIN="src-tauri/target/x86_64-unknown-linux-gnu/release/furman"
          cp "$BIN" furman-linux-amd64
          gh release upload "$GITHUB_REF_NAME" furman-linux-amd64 --repo fenio/furman

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo fenio/furman \
            --pattern "*.dmg" --pattern "furman-linux-amd64"

      - name: Compute SHA256 checksums
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "arm=$(sha256sum Furman_${VERSION}_aarch64.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum Furman_${VERSION}_x64.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum furman-linux-amd64 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: fenio/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update Furman cask
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARM_SHA=${{ steps.sha.outputs.arm }}
          INTEL_SHA=${{ steps.sha.outputs.intel }}
          mkdir -p Casks
          cat > Casks/furman.rb << CASK
          cask "furman" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/fenio/furman/releases/download/v#{version}/Furman_#{version}_aarch64.dmg"
            end

            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/fenio/furman/releases/download/v#{version}/Furman_#{version}_x64.dmg"
            end

            name "Furman"
            desc "Dual-pane file manager for macOS and Linux"
            homepage "https://github.com/fenio/furman"

            app "Furman.app"

            postflight do
              system_command "/usr/bin/xattr",
                   args: ["-cr", "#{appdir}/Furman.app"]
            end

            zap trash: [
              "~/Library/Caches/com.furman.filemanager",
              "~/Library/Preferences/com.furman.filemanager.plist",
            ]
          end
          CASK

      - name: Update Furman formula (Linux)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LINUX_SHA=${{ steps.sha.outputs.linux }}
          mkdir -p Formula
          cat > Formula/furman.rb << FORMULA
          class Furman < Formula
            desc "Dual-pane file manager for macOS and Linux"
            homepage "https://github.com/fenio/furman"
            version "${VERSION}"
            license "GPL-3.0-only"

            depends_on :linux

            url "https://github.com/fenio/furman/releases/download/v#{version}/furman-linux-amd64"
            sha256 "${LINUX_SHA}"

            def install
              bin.install "furman-linux-amd64" => "furman"
            end
          end
          FORMULA

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/furman.rb Formula/furman.rb
          git commit -m "Update furman to ${{ steps.version.outputs.version }}"
          git push
