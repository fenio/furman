name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            mcp_asset: furman-mcp-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            runner: macos-latest
            mcp_asset: furman-mcp-x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # To enable code signing, uncomment the following and add these secrets
      # to your repository settings:
      #   APPLE_CERTIFICATE        - Base64-encoded .p12 certificate
      #   APPLE_CERTIFICATE_PASSWORD - Password for the .p12 file
      #   APPLE_SIGNING_IDENTITY   - e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID                 - Apple ID email for notarization
      #   APPLE_PASSWORD           - App-specific password for notarization
      #   APPLE_TEAM_ID            - Your Apple Developer Team ID

      - name: Build MCP server binary
        run: cargo build --release --bin furman-mcp --features mcp --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Upload furman-mcp release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/${{ matrix.target }}/release/furman-mcp ${{ matrix.mcp_asset }}
          # Ensure release exists (tauri-action creates it later, but we need it now)
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "Furman ${{ github.ref_name }}" --draft=false --prerelease=false
          gh release upload "${{ github.ref_name }}" "${{ matrix.mcp_asset }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Furman ${{ github.ref_name }}"
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo fenio/furman \
            --pattern "*.dmg" --pattern "furman-mcp-*"

      - name: Compute SHA256 checksums
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "arm=$(sha256sum Furman_${VERSION}_aarch64.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum Furman_${VERSION}_x64.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "mcp_arm=$(sha256sum furman-mcp-aarch64-apple-darwin | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "mcp_intel=$(sha256sum furman-mcp-x86_64-apple-darwin | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: fenio/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update Furman cask
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARM_SHA=${{ steps.sha.outputs.arm }}
          INTEL_SHA=${{ steps.sha.outputs.intel }}
          mkdir -p Casks
          cat > Casks/furman.rb << CASK
          cask "furman" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/fenio/furman/releases/download/v#{version}/Furman_#{version}_aarch64.dmg"
            end

            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/fenio/furman/releases/download/v#{version}/Furman_#{version}_x64.dmg"
            end

            name "Furman"
            desc "Dual-pane file manager for macOS"
            homepage "https://github.com/fenio/furman"

            app "Furman.app"

            postflight do
              system_command "/usr/bin/xattr",
                   args: ["-cr", "#{appdir}/Furman.app"]
            end

            zap trash: [
              "~/Library/Caches/com.furman.filemanager",
              "~/Library/Preferences/com.furman.filemanager.plist",
            ]
          end
          CASK

      - name: Update furman-mcp formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MCP_ARM_SHA=${{ steps.sha.outputs.mcp_arm }}
          MCP_INTEL_SHA=${{ steps.sha.outputs.mcp_intel }}
          mkdir -p Formula
          cat > Formula/furman-mcp.rb << FORMULA
          class FurmanMcp < Formula
            desc "MCP server for S3 and SFTP operations (Furman)"
            homepage "https://github.com/fenio/furman"
            version "${VERSION}"
            license "GPL-3.0-only"

            on_arm do
              url "https://github.com/fenio/furman/releases/download/v#{version}/furman-mcp-aarch64-apple-darwin"
              sha256 "${MCP_ARM_SHA}"
            end
            on_intel do
              url "https://github.com/fenio/furman/releases/download/v#{version}/furman-mcp-x86_64-apple-darwin"
              sha256 "${MCP_INTEL_SHA}"
            end

            def install
              bin.install Dir["furman-mcp-*"].first => "furman-mcp"
            end
          end
          FORMULA

      - name: Remove old formulae if they exist
        run: |
          git rm -f Formula/furman.rb 2>/dev/null || true
          git rm -f Formula/furman-bin.rb 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/furman.rb Formula/furman-mcp.rb
          git commit -m "Update furman to ${{ steps.version.outputs.version }}"
          git push
