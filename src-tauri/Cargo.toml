[package]
name = "furman"
version = "0.3.11"
description = "Furman File Manager"
authors = ["Bartosz Fenski"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"
default-run = "furman"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = ["protocol-asset"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-drag = "2"
thiserror = "2"
notify = "8"
trash = "5"

portable-pty = "0.9"

nix = { version = "0.31", features = ["fs", "user"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-sdk-kms = "1"
aws-sdk-cloudfront = "1"
aws-sdk-s3control = "1"
aws-credential-types = "1"
md5 = "0.8"
crc32c = "0.6"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
keyring-core = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "net"] }
sha2 = "0.11"
reqwest = { version = "0.13", features = ["json", "form", "rustls"], default-features = false }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
russh = "0.61.0"
russh-sftp = "2.1"
glob-match = "0.2"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc", "default-client"] }

# MCP server (optional)
rmcp = { version = "1.1", features = ["server", "transport-io", "macros"], optional = true }
schemars = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }

[features]
default = []
mcp = ["rmcp", "schemars", "tracing-subscriber", "anyhow"]

[[bin]]
name = "furman-mcp"
path = "src/bin/furman-mcp.rs"
required-features = ["mcp"]

[lints.clippy]
needless_pass_by_value = "allow"  # Most are Tauri commands requiring owned types
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
manual_let_else = "warn"
implicit_clone = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
wildcard_imports = "warn"
too_many_arguments = "allow"  # build_s3_client and Tauri commands have many params

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"


[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
